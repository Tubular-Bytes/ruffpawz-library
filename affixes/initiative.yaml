# yaml-language-server: $schema=https://ruffpawz.tubularbytes.dev/api/schema/affix
id: initiative
name: Initiative
description: Determines round order
# The stat has to exist in character.yaml, so the retired affix points at physical defense.
stat: initiative
op: add
tiers:
  - { tier: 1, range: [10, 30], weight: 50 }
  - { tier: 2, range: [40, 60], weight: 35 }
  - { tier: 3, range: [70, 100], weight: 25 }
  - { tier: 4, range: [110, 130], weight: 10 }
  - { tier: 5, range: [140, 150], weight: 10 }
