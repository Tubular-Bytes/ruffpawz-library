# yaml-language-server: $schema=https://ruffpawz.tubularbytes.dev/api/schema/affix
id: defense
name: Defense
description: Replaced by physical and magic defense; kept so characters that rolled it stay valid.
retired: true
# The stat has to exist in character.yaml, so the retired affix points at physical defense.
stat: physical_defense
op: add
tiers:
  - { tier: 1, range: [1, 3], weight: 50 }
  - { tier: 2, range: [4, 6], weight: 35 }
  - { tier: 3, range: [7, 10], weight: 25 }
  - { tier: 4, range: [11, 15], weight: 10 }
