# yaml-language-server: $schema=https://ruffpawz.tubularbytes.dev/api/schema/block
id: dragon
name: Dragon
description: "They're scary, conjure fire and hard to get through. They start with 60% extra health and high defense ratings (+30 physical, +50 magic) but they're not very good at dealing physical damage (-30) and they're very slow (-40 initiative)"
skills: [firestorm]
modifiers:
  - { stat: hp, op: mul, value: 1.6 }
  - { stat: initiative, op: add, value: -40 }
  - { stat: physical_defense, op: add, value: 30 }
  - { stat: magic_defense, op: add, value: 50 }
  - { stat: physical_attack, op: add, value: -30 }
name_gen: |
  if rand() < 0.5 then
    local a = { "Vyr", "Ign", "Thar", "Zal", "Kor", "Sael", "Drak", "Ael" }
    local b = { "a", "o", "ae", "i", "y" }
    local c = { "thax", "gorn", "rax", "thor", "vyr", "dun", "moth" }
    return a[rand(#a)] .. b[rand(#b)] .. c[rand(#c)]
  else
    local a = { "Vyr", "Ign", "Thar", "Zal", "Kor", "Sael" }
    local c = { "athax", "ogorn", "yrax", "ithor", "aevyr" }
    local epithets = { "the Elder", "Ashbreath", "Emberwing", "the Unburnt", "Stormscale" }
    local name = a[rand(#a)] .. c[rand(#c)]
    if rand() < 0.5 then name = name .. " " .. epithets[rand(#epithets)] end
    return name
  end
