# yaml-language-server: $schema=https://ruffpawz.tubularbytes.dev/api/schema/block
id: bat
name: Bat
description: "They like the darkness and they can use drain. They prefer quick physical attacks, +20 initiative and +30 physical attack rating but 20% less HP and penalties to magic attack and defense. They start with drain."
skills: [drain]
modifiers:
  - { stat: hp, op: mul, value: 0.8 }
  - { stat: initiative, op: add, value: 20 }
  - { stat: physical_attack, op: add, value: 30 }
  - { stat: magic_attack, op: add, value: -20 }
  - { stat: magic_defense, op: add, value: -20 }
name_gen: |
  local starts = { "Vesper", "Nox", "Umbra", "Dusk", "Mor", "Vel", "Cael", "Sable", "Eclips", "Thessal", "Noct", "Ves" }
  local ends = { "wing", "ia", "us", "ith", "elle", "mire", "ra", "ix", "andra", "eth", "ar" }
  local epithets = {
    "Nightsip", "the Hollow", "Belfry-Born", "Moonshun", "Leatherwing", "the Unseen", "Echo-Caller",
    "Cave-Dweller", "Dusk-Drinker", "Upside-Down", "Fruitthief", "Shadow-Flit", "the Hanging", "Dandelion-Moon", "Fall-Stalker",
  }
  local places = { "the Belfry", "Deepcave", "the Old Mine", "Duskfall", "the Rafters", "Hollow Oak", "Cornflower Hollow" }

  local name = starts[rand(#starts)] .. ends[rand(#ends)]
  local roll = rand()
  if roll < 0.4 then
    return name
  elseif roll < 0.75 then
    return name .. " " .. epithets[rand(#epithets)]
  else
    return name .. " of " .. places[rand(#places)]
  end
