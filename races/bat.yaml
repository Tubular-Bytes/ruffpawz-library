# yaml-language-server: $schema=https://ruffpawz.tubularbytes.dev/api/schema/block
id: bat
name: Bat
description: "They like the darkness and they can use drain. They prefer quick physical attacks, +20 initiative and +30 physical attack rating but 20% less HP and penalties to magic attack and defense. They start with drain."
skills: [drain]
modifiers:
  - { stat: hp, op: mul, value: 0.8 }
  - { stat: initiative, op: add, value: 20 }
  - { stat: physical_attack, op: add, value: 30 }
  - { stat: magic_attack, op: add, value: -20 }
  - { stat: magic_defense, op: add, value: -20 }
name_gen: |
  local names = { "Lestat", "Bill", "Erik", "Godric", "Pam", "Jessica" }
  return names[rand(#names)]
