# yaml-language-server: $schema=https://ruffpawz.tubularbytes.dev/api/schema/block
id: kitten
name: Kitten
description: "Some say they selfish but at least they know sweep. They're fairly quick, handy with physical weapons but weak to magic damage."
skills: [sweep]
modifiers:
  - { stat: initiative, op: add, value: 1 }
  - { stat: physical_attack, op: add, value: 4 }
  - { stat: magic_defence, op: add, value: -4 }
name_gen: |
  local names = { "Luna", "Milo", "Leo", "Bella", "Charlie", "Lucy", "Loki", "Shadow", "Max" }
  return names[rand(#names)]
