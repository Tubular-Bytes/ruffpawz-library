# yaml-language-server: $schema=https://ruffpawz.tubularbytes.dev/api/schema/block
id: orc
name: Orc
description: "Tough but slow: +15 health, -1 initiative. Bloodrage: +25% physical and magic attack while below half health. Knows Orc Rage."
skills: [orc_rage]
retired: true
modifiers:
  - { stat: hp, op: add, value: 15 }
  - { stat: initiative, op: add, value: -1 }
  # Bloodrage: +25% physical and magic attack while below half health (condition is Lua, re-checked every turn).
  - { stat: physical_attack, op: mul, value: 1.25, conditions: [{condition: "source.hp < source.max_hp * 0.5", tooltip: "health is below 50%"}] }
  - { stat: magic_attack, op: mul, value: 1.25, conditions: [{condition: "source.hp < source.max_hp * 0.5", tooltip: "health is below 50%"}] }
name_gen: |
  local a = { "Gr", "Kr", "Mog", "Dur", "Thok", "Ug" }
  local b = { "ash", "uk", "og", "ar", "ul" }
  local c = { "nak", "gash", "dum", "rok", "bur" }
  return a[rand(#a)] .. b[rand(#b)] .. c[rand(#c)]
