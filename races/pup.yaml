# yaml-language-server: $schema=https://ruffpawz.tubularbytes.dev/api/schema/block
id: pup
name: Pup
description: "Arf. They are strong and fierce protectors but they're slow. They start with 40% extra health and +20 on both defense types but they have -20 penalty on their initiative and their attack ratings are also decreased by 10."
skills: [guard]
modifiers:
  - { stat: hp, op: mul, value: 1.4 }
  - { stat: initiative, op: add, value: -20 }
  - { stat: physical_attack, op: add, value: -10 }
  - { stat: magic_attack, op: add, value: -10 }
  - { stat: physical_defense, op: add, value: 20 }
  - { stat: magic_defense, op: add, value: 20 }
name_gen: |
  local names = { "Bandit", "Bluey", "Bingo", "Chilli", "Chloe" }
  return names[rand(#names)]
