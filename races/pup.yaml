# yaml-language-server: $schema=https://ruffpawz.tubularbytes.dev/api/schema/block
id: pup
name: Pup
description: "Arf. They are strong and fierce protectors but they're slow. They start with 40% extra health and +20 on both defense types but they have -20 penalty on their initiative and their attack ratings are also decreased by 10. They start with rage, which raises their physical and magic attack by 40% for 2 rounds."
skills: [rage]
modifiers:
  - { stat: hp, op: mul, value: 1.4 }
  - { stat: initiative, op: add, value: -20 }
  - { stat: physical_attack, op: add, value: -10 }
  - { stat: magic_attack, op: add, value: -10 }
  - { stat: physical_defense, op: add, value: 20 }
  - { stat: magic_defense, op: add, value: 20 }
name_gen: |
  local plain = {
    "Bram", "Biscuit", "Rusty", "Tuck", "Mabel", "Juniper", "Gus", "Waffles", "Dot", "Moose",
    "Pippin", "Barley", "Clover", "Sausage", "Tilly", "Fudge", "Hazel", "Buster", "Pepper", "Ziggy",
  "Dandelion", "Cornflower", "Fallow", "Fall",
  }
  local jobs = { "Gate", "Hearth", "Flock", "Cart", "Bridge", "Camp", "Hill", "Barn" }
  local roles = { "warden", "keeper", "guard", "watch", "hound" }
  local epithets = {
    "Goodboy", "Stickfetcher", "Gatewarden", "the Steadfast", "Muddypaws", "Bellyrub-Bane",
    "the Loyal", "Squeaky-Toy", "Tail-Wagger", "Postman-Chaser", "Couch-Guard", "the Very Good",
  "Dandelion-Chaser", "Cornflower-Crowned", "the Fall-Born", "Circled-by-Cornflowers",
  }

  -- a rare full name, about 1 in 100
  if rand() < 0.01 then return "Fall Dandelions Circled by Cornflowers" end

  local roll = rand()
  if roll < 0.5 then
    return plain[rand(#plain)]
  elseif roll < 0.8 then
    return plain[rand(#plain)] .. " " .. epithets[rand(#epithets)]
  else
    -- a title instead of an epithet: "Barn-guard Pippin"
    local title = jobs[rand(#jobs)] .. "-" .. roles[rand(#roles)]
    return title .. " " .. plain[rand(#plain)]
  end
