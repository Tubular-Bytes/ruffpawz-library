# yaml-language-server: $schema=https://ruffpawz.tubularbytes.dev/api/schema/skill
id: entangle
name: Entangle
description: "Surrounds a random enemy with vines that lower their initiative by 40 and deal 50% of the caster's magic attack damage to them over time, both for 3 rounds. The damage ignores defense."
cooldown: 3
lua: |
  local t = enemies[rand(#enemies)]
  add_effect{ kind = "damage_over_time", target = t, duration = 3, amount = caster.stats.magic_attack * 0.5, name = "Tangled" }
  add_modifier{ target = t, stat = "initiative", op = "add", value = -40, duration = 3, name = "Tangled"}
