# yaml-language-server: $schema=https://ruffpawz.tubularbytes.dev/api/schema/skill
id: fog_potion
name: Fog Potion
description: "Everyone, allies and enemies, deals 20% less physical and magic attack for 2 rounds."
cooldown: 6
lua: |
  -- applies_to = {} affects everyone: a global effect
  add_modifier{ stat = "physical_attack", op = "mul", value = 0.8, applies_to = {}, duration = 2, name = "Fog" }
  add_modifier{ stat = "magic_attack", op = "mul", value = 0.8, applies_to = {}, duration = 2, name = "Fog" }
