# yaml-language-server: $schema=https://ruffpawz.tubularbytes.dev/api/schema/skill
id: chain_lightning
name: Chain Lightning
description: "Releases a chain lightning with decreasing chance to hit enemies. Enemies hit take 80% of your magic attack as damage, mitigated by magic defense."
cooldown: 3
lua: |
  local chances = { 1, 0.9, 0.7, 0.4 }  -- chance that the Nth enemy is hit
  for i, t in ipairs(enemies) do
    if rand() >= (chances[i] or 0) then break end
    deal_damage(t, math.floor(mitigate(caster.stats.magic_attack * 0.8, t, "magic", 0.8) + 0.5))
  end
