# yaml-language-server: $schema=https://ruffpawz.tubularbytes.dev/api/schema/skill
id: chaos_bolt
name: Chaos Bolt
description: "Hits one random enemy with chaos for 150% of your magic attack. Half their magic defense counts against it (at least 1)."
cooldown: 2
tags: [chaos]   # all damage this skill deals carries the chaos tag
lua: |
  local t = enemies[rand(#enemies)]
  deal_damage(t, math.floor(mitigate(caster.stats.magic_attack * 1.5, t, "magic", 0.5) + 0.5))
