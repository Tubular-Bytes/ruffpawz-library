# yaml-language-server: $schema=https://ruffpawz.tubularbytes.dev/api/schema/skill
id: flurry
name: Flurry
description: "Two quick hits, each on a random enemy (it can be the same one twice). Each deals 80% of your attack minus half the target's defense (at least 1)."
cooldown: 3
lua: |
  for _ = 1, 2 do
    local t = enemies[rand(#enemies)]
    deal_damage(t, math.max(1, math.floor(caster.stats.attack * 0.8 * 40 / (40 + t.stats.defense * 1) + 0.5)))
  end
