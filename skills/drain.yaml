# yaml-language-server: $schema=https://ruffpawz.tubularbytes.dev/api/schema/skill
id: drain
name: Drain
description: "Hits one random enemy for your attack and heals you for 150% of the health that took from them."
cooldown: 2
lua: |
  local t = enemies[rand(#enemies)]
  deal_damage(t, caster.stats.attack)
  heal_from_damage(caster, 1.5)
