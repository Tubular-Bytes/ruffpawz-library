# yaml-language-server: $schema=https://ruffpawz.tubularbytes.dev/api/schema/skill
id: drain
name: Drain
description: "Hits one random enemy for your attack, heals 20% of the damage - minimum 1"
cooldown: 2
lua: |
  local t = enemies[rand(#enemies)]
  deal_damage(t, caster.stats.attack)
  heal(caster, math.max(1, caster.stats.attack * 0.2))