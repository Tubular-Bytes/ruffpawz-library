# yaml-language-server: $schema=https://ruffpawz.tubularbytes.dev/api/schema/skill
id: drain
name: Drain
description: "Hits one random enemy for your magic attack, ignoring their defense, and heals you for 125% of your magic attack."
cooldown: 2
lua: |
  local t = enemies[rand(#enemies)]
  deal_damage(t, caster.stats.magic_attack)
  heal(caster, caster.stats.magic_attack * 1.25)
