# yaml-language-server: $schema=https://ruffpawz.tubularbytes.dev/api/schema/skill
id: frost_bolt
name: Frost Bolt
description: "Hits one random enemy with frost for 140% of your magic attack. Half their magic defense counts against it (at least 1). Hitting a target that is not frozen has a 40% chance to apply Frozen. Hitting a target that is already frozen has a 20% chance to refresh Frozen duration but only deals 50% of the calculated damage"
cooldown: 2
tags: [frost]   # all damage this skill deals carries the frost tag
lua: |
  local frozen_modifier = 0.5
  local freeze_chance = 0.4
  local refreeze_chance = 0.2
  local t = enemies[rand(#enemies)]
  local damage = mitigate(caster.stats.magic_attack * 1.4, t, "magic", 0.5)
  
  local frozen = false
  for _, e in ipairs(t.effects) do
    if e.name == "Frozen" then frozen = true end
  end

  if frozen then damage = damage * frozen_modifier end
  if rand() < (frozen and refreeze_chance or freeze_chance) then
    add_effect{ kind = "stun", target = t, duration = 2, dispel = { "ice" }, name = "Frozen" }
  end

  deal_damage(t, math.floor(damage + 0.5))
