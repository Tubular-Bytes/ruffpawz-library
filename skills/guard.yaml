# yaml-language-server: $schema=https://ruffpawz.tubularbytes.dev/api/schema/skill
id: guard
name: Guard
description: "Raises your own physical and magic defense by 60 for 2 rounds, and those of one random other ally by 30."
cooldown: 3
lua: |
  local buff_value_self = 60
  local buff_value_other = 30

  local function buff(who, value)
    for _, stat in ipairs{ "physical_defense", "magic_defense" } do
      add_modifier{ target = who, stat = stat, op = "add", value = value, duration = 2, name = "Guard" }
    end
  end

  buff(caster, buff_value_self)

  local others = {}
  for _, a in ipairs(allies) do
    if a.id ~= caster.id then others[#others + 1] = a end
  end
  if #others > 0 then buff(others[rand(#others)], buff_value_other) end
