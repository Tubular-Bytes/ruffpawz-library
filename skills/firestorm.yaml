# yaml-language-server: $schema=https://ruffpawz.tubularbytes.dev/api/schema/skill
id: firestorm
name: Firestorm
description: "Hits every enemy for 50% of your magic attack with fire, 60% of their magic defense counting against it (at least 1 each). For 3 rounds, everyone carrying a frost item (weapon, armor, ...) deals 20 less damage, allies included."
cooldown: 5
tags: [fire]
lua: |
  local everyone = {}
  for _, t in ipairs(enemies) do everyone[#everyone + 1] = t end
  for _, t in ipairs(allies) do everyone[#everyone + 1] = t end

  for _, t in ipairs(everyone) do
    if t.team ~= caster.team then
      deal_damage(t, math.floor(mitigate(caster.stats.magic_attack * 0.5, t, "magic", 0.6) + 0.5))
    end

    for _, e in ipairs(t.effects) do
      if e.name == "Frozen" then
        if rand() < 0.4 then cleanse{ target = t, name = "Frozen" } end
        break  -- one roll per character
      end
    end
  end

  -- Anything with a frost-tagged item (weapon, armor, ...) deals 20 less damage for 3 rounds.
  add_modifier{
    damage = "dealt", op = "add", value = -20,
    applies_to = { tags = { "frost" } }, duration = 3, name = "Firestorm",
  }
