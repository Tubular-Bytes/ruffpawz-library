# yaml-language-server: $schema=https://ruffpawz.tubularbytes.dev/api/schema/skill
id: power_strike
name: Power Strike
description: "Hits one random enemy for 150% of your physical attack. Their physical defense counts against it (at least 1)."
cooldown: 2
lua: |
  local t = enemies[rand(#enemies)]
  deal_damage(t, math.floor(mitigate(caster.stats.physical_attack * 1.5, t, "physical", 1) + 0.5))
