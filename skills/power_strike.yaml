# yaml-language-server: $schema=https://ruffpawz.tubularbytes.dev/api/schema/skill
id: power_strike
name: Power Strike
description: "Hits one random enemy for 150% of your attack, reduced by their defense (at least 1)."
cooldown: 2
lua: |
  local t = enemies[rand(#enemies)]
  deal_damage(t, math.max(1, math.floor(caster.stats.attack * 1.5 * 40 / (40 + t.stats.defense * 1) + 0.5)))
