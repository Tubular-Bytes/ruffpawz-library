id: staff
name: Staff
description: "A random +1 to +4 attack. Always offers Chain Lightning, plus either Flurry or Sweep, decided when the character is made."
skills: [chain_lightning, flurry, sweep]
roll: |
  local second = rand(2) == 1 and "flurry" or "sweep"
  return {
    modifiers = { { stat = "attack", op = "add", value = rand(1, 4) } },
    skills = { "chain_lightning", second },
  }
